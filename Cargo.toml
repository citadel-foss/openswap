[package]
name = "openswap"
version = "0.2.2"
authors = ["Developers at Citadel FOSS"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

description = "Functioning, minimal-viable binaries and libraries to perform a trustless, p2p Maxwell-Belcher OpenSwap Protocol"
license = "MIT OR Apache-2.0"          
documentation = "https://docs.rs/openswap"
homepage = "https://github.com/citadel-foss/openswap" 
repository = "https://github.com/citadel-foss/openswap" 
categories = ["Bitcoin", "Atomic Swap", "HTLC"]   
keywords = ["bitcoin", "HTLC", "openswap"]  

[dependencies]
bip39 =  { version = "2.1.0", features = ["rand"] }
bitcoin =  "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11.2"
log = "^0.4"
dirs = "3.0.1"
clap = { version = "4.5", features = ["derive"] }
bitcoind = "0.36"
electrum-client = { version = "0.24", default-features = false, features = ["proxy", "use-rustls-ring"] }
log4rs = "1.3.0"
secp256k1 = { version = "0.33.0", features = ["rand", "global-context"] }
minreq = { version = "2.12.0", features = ["https"] }
pbkdf2 = { version = "0.12", features = ["simple"] }
aes-gcm = "0.10.3"
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
sha2 = "0.10.9"
sha3 = "0.10.8"
rust-coinselect = "0.1.7"
crossterm = "0.29.0"
zmq = "0.10.0"
tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"]}
rustls = { version = "0.23.40", default-features = false, features = ["std", "ring"] }
nostr = "0.44.2"
crossbeam-channel = "0.5.15"

[dev-dependencies]
flate2 = {version = "1.0.35"}
tar = {version = "0.4.43"}
electrsd = { version = "0.28", features = ["electrs_0_9_11"] }

#Empty default feature set, (helpful to generalise in github actions)
[features]
default = []
# The following feature set is in response to the issue described at https://github.com/rust-lang/rust/issues/45599
# Only used for running the integration tests
integration-test = []

[package.metadata.cargo-machete]
ignored = ["rustls"]
